<!doctype html>
<html>
    <head>
        <title>Transaction Manager Test</title>
        <link rel="stylesheet" href="styles.css" />
        <link rel="stylesheet" href="enhanced-styles.css" />
        <link rel="stylesheet" href="ledger-management-styles.css" />
        <link rel="stylesheet" href="welcome-screen.css" />
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    </head>
    <body>
        <header class="app-header">
            <div class="app-title">
                <h1>Budgie</h1>
                <span id="ledger-title-separator" class="ledger-title-separator hidden">/</span>
                <span id="current-ledger-name" class="current-ledger-name hidden"></span>
            </div>
            <div class="header-actions">
                <button id="close-ledger-btn" class="close-ledger-btn hidden" aria-label="Close Ledger">
                    &times;
                </button>
                <button id="hamburger-menu-btn" class="hamburger-btn" aria-label="Menu">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
                <div id="dropdown-menu" class="dropdown-menu hidden">
                    <button id="new-ledger-btn" class="menu-item">New</button>
                    <button id="open-network-btn" class="menu-item">Open from Network</button>
                    <button id="save-network-btn" class="menu-item">Save to Network</button>
                    <button id="close-ledger-menu-btn" class="menu-item">Close Ledger</button>
                    <div class="menu-divider"></div>
                    <button id="import-ledger-btn" class="menu-item">Import</button>
                    <button id="export-ledger-btn" class="menu-item">Export</button>
                    <div class="menu-divider"></div>
                    <button id="rename-ledger-btn" class="menu-item">Rename</button>
                    <button id="print-ledger-btn" class="menu-item">Print</button>
                    <div class="menu-divider"></div>
                    <button id="delete-ledger-btn" class="menu-item danger">Delete</button>
                </div>
            </div>
        </header>
        
        <!-- Welcome Screen (shown when no ledger is active) -->
        <div id="welcome-screen" class="welcome-screen hidden">
            <div class="welcome-container">
                <div class="welcome-header">
                    <h2>Welcome to Budgie</h2>
                    <p>Your Personal Finance Manager</p>
                </div>
                
                <div class="recent-ledgers-section">
                    <h3>Recent Ledgers</h3>
                    <div id="recent-ledgers-list" class="recent-ledgers-list">
                        <!-- Populated dynamically -->
                    </div>
                    <div id="no-ledgers-message" class="no-ledgers-message hidden">
                        <p>No ledgers yet. Create your first ledger to get started!</p>
                    </div>
                </div>
                
                <div class="welcome-actions">
                    <button id="welcome-new-btn" class="welcome-btn primary">
                        <span class="btn-icon">+</span> New Ledger
                    </button>
                    <button id="welcome-open-network-btn" class="welcome-btn">
                        <span class="btn-icon">[]</span> Open from Network
                    </button>
                    <button id="welcome-import-btn" class="welcome-btn">
                        <span class="btn-icon">&lt;</span> Import
                    </button>
                    <button id="welcome-browse-all-btn" class="welcome-btn">
                        <span class="btn-icon">=</span> Browse All
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Ledger View (shown when a ledger is active) -->
        <div id="ledger-view" class="ledger-view">
            <table id="ledger">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Credit (+)</th>
                    <th>Debit (-)</th>
                    <th>Balance</th>
                    <th>Paid</th>
                    <th>Cleared</th>
                </tr>
            </thead>
            <tbody>
                <tr data-row-type="starting-balance">
                    <td><input type="date" /></td>
                    <td>Starting Balance</td>
                    <td></td>
                    <td></td>
                    <td>0.00</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr data-row-type="totals">
                    <td><strong>Totals</strong></td>
                    <td></td>
                    <td>0.00</td>
                    <td>0.00</td>
                    <td>0.00</td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
        </table>
        </div>

        <script src="transaction-manager.js"></script>
        <script src="ledger-renderer.js"></script>
        <script src="ledger-controller.js"></script>
        <script src="ledger-selection.js"></script>
        <script src="ledger-management.js"></script>
        <script src="network-sync.js"></script>
        <script src="app-state-manager.js"></script>
        <script src="script.js"></script>
    </body>
</html>
